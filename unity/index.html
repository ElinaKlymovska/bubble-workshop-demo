<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bubble Workshop</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1c1628; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    /* The game is a portrait phone game: a column the shape of a phone, centred; on a phone it fills the screen. */
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #frame { position: relative; height: 100%; aspect-ratio: 9 / 19.5; max-width: 100%; max-height: 100%; background: #f7ebd6; }
    @media (min-aspect-ratio: 9/19.5) { #frame { height: 100%; width: auto; } }
    @media (max-aspect-ratio: 9/19.5) { #frame { width: 100%; height: auto; } }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #f7ebd6; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f7ebd6; color: #5b3f8e; font-weight: 800; }
    #loading h1 { margin: 0; font-size: 28px; text-align: center; }
    #bar { width: 56%; height: 10px; border-radius: 6px; background: #e3d6f4; overflow: hidden; }
    #fill { height: 100%; width: 0; background: #7a4fd3; transition: width .2s; }
    #note { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 13px; font-weight: 600; color: #7d6f96; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><h1>Bubble Workshop</h1><div id="bar"><div id="fill"></div></div><div id="note">Завантаження гри…</div></div>
    </div>
  </div>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    var fill = document.getElementById('fill'), loading = document.getElementById('loading'), note = document.getElementById('note');
    createUnityInstance(document.querySelector('#unity-canvas'), {
      arguments: [],
      dataUrl: 'Build/WebGL.data.unityweb',
      frameworkUrl: 'Build/WebGL.framework.js.unityweb',
      codeUrl: 'Build/WebGL.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Elina Klymovska',
      productName: 'Bubble Workshop',
      productVersion: '0.3.0',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, function (p) { fill.style.width = (p * 100) + '%'; }).then(function () {
      loading.style.display = 'none';
    }).catch(function (e) {
      note.textContent = 'Не вдалося запустити гру: ' + e;
    });
  </script>
</body>
</html>
